<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condition Checker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="mainPart">
    <div class="container">
        
    <h1>Check Your Information</h1>
        <input type="number" id="age" placeholder="Enter your age">


    <input type="text" id="job" placeholder="Do you have a job? true/false">

    <input type="number" id="salary" placeholder="Enter your salary">


    <button id="btn">Check</button>

    <h2 id="jobResult"></h2>
    <h2 id="salaryResult"></h2>
    <h2 id="ageResult"></h2>
    <h2 id="total"></h2>
    </div>
</div>

    <script src="js/script.js"></script>
</body>
</html>
